name: Fetch GitHub Trending

on:
  workflow_dispatch:

  schedule:
    - cron: '0 0 * * *' # 北京时间 08:00
    - cron: '0 6 * * *' # 北京时间 14:00
    - cron: '0 12 * * *' # 北京时间 20:00
    - cron: '0 18 * * *' # 北京时间次日 02:00

permissions:
  contents: write

concurrency:
  group: github-trending-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@10.34.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # - name: Build the languages
      #   run: pnpm gen:lang

      - name: Fetch GitHub Trending
        run: pnpm build

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data

          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi

          COMMIT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          git commit -m "publish: 更新 GitHub Trending 数据 ${COMMIT_TIME}"
          git push
